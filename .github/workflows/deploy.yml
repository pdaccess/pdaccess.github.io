name: Deploy to k3s

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: pdaccess
  REGISTRY: ${{ secrets.REGISTRY_URL || 'registry.home.arpa/pdaccess' }}
  CHART_PATH: charts/pdaccess
  RELEASE_NAME: pdaccess
  KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}

jobs:
  lint:
    name: Lint Helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Lint chart
        run: helm lint ${{ env.CHART_PATH }}

  build-and-deploy:
    name: Build & Deploy
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get git SHA
        id: sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ env.KUBE_CONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Install Helm (if needed)
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Deploy with Helm
        run: |
          helm upgrade ${{ env.RELEASE_NAME }} ${{ env.CHART_PATH }} \
            --install \
            --create-namespace \
            --namespace pdaccess \
            --set "image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" \
            --set "image.tag=${{ steps.sha.outputs.sha }}" \
            --set "ingress.host=${{ secrets.INGRESS_HOST || 'pweb.home.arpa' }}" \
            --wait --timeout 300s
